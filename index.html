<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuKo Studio Global OS v2.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #1e1e24; color: #fff; }
        header { background: #111; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffcc00; }
        h1 { color: #ffcc00; font-size: 1.4rem; }
        .slogan { font-style: italic; font-size: 0.85rem; color: #aaa; }
        .clear-btn { background: #e74c3c; color: #fff; border: none; padding: 8px 12px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .menu-container { background: #2a2a35; padding: 10px; position: relative; border-bottom: 1px solid #3e3e50; }
        .main-menu-btn { background: #ffcc00; color: #000; font-weight: bold; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; text-align: left; display: flex; justify-content: space-between; }
        .dropdown-content { display: none; background: #1a1a22; border: 1px solid #ffcc00; margin-top: 5px; border-radius: 5px; max-height: 220px; overflow-y: auto; padding: 5px; z-index: 100; position: absolute; left: 10px; right: 10px; }
        .dropdown-content.show { display: block; }
        .tool-btn { display: block; width: 100%; background: none; color: #fff; border: none; padding: 10px; text-align: left; cursor: pointer; border-bottom: 1px solid #2a2a35; font-size: 0.85rem; }
        .tool-btn:hover { background: #3e3e50; color: #ffcc00; }
        .main-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .editor-zone { flex: 1; display: flex; flex-direction: column; padding: 10px; }
        textarea { flex: 1; background: #111; color: #00ff00; border: 1px solid #3e3e50; padding: 12px; font-family: monospace; font-size: 0.95rem; resize: none; border-radius: 5px; }
        .tabs-bar { display: flex; background: #111; border-top: 4px solid #ffcc00; }
        .tab-btn { flex: 1; background: #222; color: #aaa; border: none; padding: 12px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .tab-btn.active { background: #fff; color: #000; }
        .view-content { display: none; flex: 1; background: #fff; color: #000; padding: 15px; overflow-y: auto; }
        .view-content.active { display: block; }
        .buko-space-title { font-size: 1.2rem; font-weight: bold; color: #2c3e50; border-bottom: 2px solid #ffcc00; padding-bottom: 3px; margin-bottom: 10px; text-align: center; }
        .buko-btn { padding: 12px; border: none; border-radius: 5px; font-weight: bold; margin: 8px 0; display: block; width: 100%; max-width: 280px; color: white; text-align: center; }
        .buko-btn.Vert { background: #2ecc71; } .buko-btn.Bleu { background: #3498db; } .buko-btn.Standard { background: #bdc3c7; color: black; }
        .buko-text { font-size: 1rem; margin: 6px 0; color: #333; font-weight: bold; text-align: center; }
        .buko-input { display: block; width: 100%; padding: 10px; margin: 8px 0; border: 2px solid #bdc3c7; border-radius: 5px; }
        .bdd-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        .bdd-table th, .bdd-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .bdd-table th { background: #2c3e50; color: white; }
        .generate-bar { background: #111; padding: 10px; text-align: center; }
        .gen-btn { background: #ffcc00; color: #000; border: none; padding: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>BuKo Studio Global OS v2.0 📦</h1>
            <div class="slogan">« Tout ce qui est facile, c'est du buko »</div>
        </div>
        <button class="clear-btn" onclick="effacerTout()">🗑️ Effacer</button>
    </header>
    <div class="menu-container">
        <button class="main-menu-btn" onclick="toggleMenu()">📦 <span>Déployer la Super-Boîte BuKo v2.0</span> ▾</button>
        <div class="dropdown-content" id="dropdownMenu"></div>
    </div>
    <div class="main-container">
        <div class="editor-zone">
            <textarea id="codeEditor" placeholder="Écrivez votre logique universelle ici..." oninput="compilerBuKo()"></textarea>
        </div>
        <div class="tabs-bar">
            <button class="tab-btn active" id="btnTabApp" onclick="switchTab('app')">📱 APERCU LIVE</button>
            <button class="tab-btn" id="btnTabBdd" onclick="switchTab('bdd')">🗄️ BASE DE DONNÉES</button>
        </div>
        <div class="view-content active" id="viewApp"><div id="canvas"></div></div>
        <div class="view-content" id="viewBdd">
            <h3 style="color:#2c3e50; margin-bottom:10px;">📋 Stockage Permanent Intégré</h3>
            <table class="bdd-table">
                <thead><tr><th>Horodatage</th><th>Composant</th><th>Donnée Clé</th></tr></thead>
                <tbody id="bddRows"><tr><td colspan="3" style="text-align:center; color:#999;">Aucune donnée.</td></tr></tbody>
            </table>
        </div>
    </div>
    <div class="generate-bar">
        <button class="gen-btn" onclick="genererApplication()">Générer mon Application Totale</button>
    </div>

    <script>
        let cibleSysteme = 'web';
        const outils = [
            { nom: '🎵 Multimédia : Déclencher un son ou bruitage', code: 'jouer_son: "collision.mp3" .' },
            { nom: '🔒 Biométrie : Scanner empreinte digitale', code: 'securite -> scanner_empreinte .' },
            { nom: '📷 Caméra : Ouvrir l\'objectif en direct', code: 'activer -> ouvrir_camera .' },
            { nom: '🔔 Push : Envoyer une notification écran', code: 'notifier: "Opération réussie !" .' },
            { nom: '⏱️ Boucle : Répéter une action en continu', code: 'repeter_chaque_seconde ->\n    accelerer voiture .\n.' },
            { nom: '🗄️ Stockage : Connecter à la BDD Cloud', code: 'bouton b1 [texte: "Encaisser", couleur: Vert, sauvegarde: "ventes"] .' },
            { nom: '🧮 Calcul : Opération mathématique', code: 'calcul: marge = prix_vente - prix_achat .' },
            { nom: '🛰️ GPS : Afficher carte mondiale', code: 'carte -> centrer_sur: "Paris" .' },
            { nom: '📥 Graphique : Zone de Saisie', code: 'zone_saisie nom_produit [indication: "Nom de l\'article"] .' }
        ];

        function toggleMenu() { document.getElementById('dropdownMenu').classList.toggle('show'); }
        function switchTab(type) {
            document.getElementById('btnTabApp').classList.toggle('active', type === 'app');
            document.getElementById('btnTabBdd').classList.toggle('active', type === 'bdd');
            document.getElementById('viewApp').classList.toggle('active', type === 'app');
            document.getElementById('viewBdd').classList.toggle('active', type === 'bdd');
            if(type === 'bdd') rafraichirBdd();
        }
        function effacerTout() { if(confirm("Tout effacer ?")) { document.getElementById('codeEditor').value = ''; compilerBuKo(); } }
        
        function chargerBoiteOutils() {
            const menu = document.getElementById('dropdownMenu'); menu.innerHTML = '';
            outils.forEach(outil => {
                let btn = document.createElement('button'); btn.className = 'tool-btn'; btn.innerText = outil.nom;
                btn.onclick = () => {
                    const ed = document.getElementById('codeEditor');
                    ed.value += (ed.value.endsWith('\n') || ed.value === '' ? '' : '\n') + outil.code + '\n';
                    toggleMenu(); compilerBuKo();
                };
                menu.appendChild(btn);
            });
        }
        chargerBoiteOutils();
        function rafraichirBdd() {
            const tbody = document.getElementById('bddRows');
            let data = JSON.parse(localStorage.getItem('buko_mock_bdd')) || [];
            if(data.length === 0) { tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#999;">Aucune donnée.</td></tr>'; return; }
            tbody.innerHTML = '';
            data.forEach(item => { tbody.innerHTML += `<tr><td>${item.time}</td><td>${item.comp}</td><td>${item.val}</td></tr>`; });
        }

        function simulerEnregistrementBdd(composant, valeur) {
            let data = JSON.parse(localStorage.getItem('buko_mock_bdd')) || [];
            let date = new Date().toLocaleTimeString();
            data.unshift({ time: date, comp: composant, val: valeur });
            localStorage.setItem('buko_mock_bdd', JSON.stringify(data));
        }

        function compilerBuKo() {
            const code = document.getElementById('codeEditor').value;
            const canvas = document.getElementById('canvas');
            const previewHeader = document.getElementById('lblPreview');
            canvas.innerHTML = ''; const lignes = code.split('\n');
            
            lignes.forEach(ligne => {
                let l = ligne.trim();
                if (l.startsWith('[') && l.endsWith(']')) {
                    let t = document.createElement('div'); t.className = 'buko-space-title'; t.innerText = l.slice(1, -1); canvas.appendChild(t); return;
                }
                if (!l.endsWith('.')) return;
                l = l.slice(0, -1).trim(); 
                
                if (l.startsWith('jouer_son:') || l.startsWith('notifier:')) {
                    let b = document.createElement('div'); b.className = 'buko-text'; b.style.background = '#e8f4fd'; b.style.color = '#1d9bf0'; b.style.padding = '8px'; b.innerText = `🎵 [EFFETS MULTIMÉDIA ACTIFS]`; canvas.appendChild(b); return;
                }
                if (l.startsWith('repeter_')) {
                    let b = document.createElement('div'); b.className = 'buko-text'; b.style.background = '#e2f0d9'; b.style.color = '#385723'; b.style.padding = '8px'; b.innerText = `⏱️ [BOUCLE TEMPORELLE OS ACTIVÉE]`; canvas.appendChild(b); return;
                }
                if (l.startsWith('calcul:')) {
                    let b = document.createElement('div'); b.className = 'buko-text'; b.style.color = '#7f8c8d'; b.innerText = `🧮 Opération : ${l.slice(7)}`; canvas.appendChild(b); return;
                }
                if (l.startsWith('carte ->')) {
                    let b = document.createElement('div'); b.style.width = '100%'; b.style.height = '100px'; b.style.background = '#cad0d4'; b.style.borderRadius = '5px'; b.style.display = 'flex'; b.style.alignItems = 'center'; b.style.justifyContent = 'center'; b.style.fontWeight = 'bold'; b.innerText = `🗺️ [CARTE LIVE INTÉGRÉE]`; canvas.appendChild(b); return;
                }
                if (l.startsWith('ia ->') || l.startsWith('securite ->') || l.startsWith('activer ->')) {
                    let b = document.createElement('div'); b.className = 'buko-text'; b.style.background = '#d4edda'; b.style.color = '#155724'; b.style.padding = '8px'; b.innerText = `🤖 [MATÉRIEL ET BIOMÉTRIE VERROUILLÉS]`; canvas.appendChild(b); return;
                }
                
                let t_txt = 'Bouton'; let t_cont = 'Texte'; let t_ind = 'Saisie...'; let t_col = 'Standard';
                let matchOptions = l.match(/\[(.*)\]/);
                if (matchOptions) {
                    matchOptions.split(',').forEach(part => {
                        if (part.includes(':')) {
                            let [k, v] = part.split(':'); let cleanK = k.trim(); let cleanV = v.trim().replace(/"/g, '');
                            if(cleanK === 'texte' || cleanK === 'text') t_txt = cleanV;
                            if(cleanK === 'contenu' || cleanK === 'content') t_cont = cleanV;
                            if(cleanK === 'indication') t_ind = cleanV;
                            if(cleanK === 'couleur' || cleanK === 'color') t_col = cleanV;
                        }
                    });
                }
                let nomTech = l.split(/\s+/) || 'elem';
                if (l.startsWith('bouton') || l.startsWith('button')) {
                    let btn = document.createElement('button'); btn.className = `buko-btn ${t_col}`; btn.id = nomTech; btn.innerText = t_txt;
                    btn.onclick = function() {
                        let inputVal = document.querySelector('.buko-input') ? document.querySelector('.buko-input').value : 'Valeur';
                        simulerEnregistrementBdd(t_txt, inputVal);
                        alert(`📦 SYSTEM BUKO GLOBAL :\nDonnée traitée et synchronisée avec l'onglet Base de Données !`);
                    };
                    canvas.appendChild(btn);
                } else if (l.startsWith('affichage_texte') || l.startsWith('text_display')) {
                    let txt = document.createElement('div'); txt.className = 'buko-text'; txt.id = nomTech; txt.innerText = t_cont; canvas.appendChild(txt);
                } else if (l.startsWith('zone_saisie') || l.startsWith('input_field')) {
                    let inp = document.createElement('input'); inp.className = 'buko-input'; inp.id = nomTech; inp.placeholder = t_ind;
                    canvas.appendChild(inp);
                }
            });
        }
        function genererApplication() {
            const HTML_Contenu = document.getElementById('canvas').innerHTML;
            const codeSource = document.getElementById('codeEditor').value;
            if(!HTML_Contenu.trim()) { alert("Votre application est vide !"); return; }
            let scriptActions = "";
            if (codeSource.includes('PingPong') || codeSource.includes('jeu')) {
                scriptActions = `
                    let canvasJeu = document.createElement('canvas'); canvasJeu.id = 'gameCanvas'; canvasJeu.width = 400; canvasJeu.height = 250; canvasJeu.style.background = '#000'; canvasJeu.style.display = 'block'; canvasJeu.style.margin = '15px auto'; document.body.appendChild(canvasJeu);
                    let ctx = canvasJeu.getContext('2d'); let rG = 90, rD = 90, bX = 200, bY = 125, vX = 4, vY = 4;
                    function dessiner() {
                        ctx.clearRect(0, 0, 400, 250); ctx.fillStyle = '#fff'; ctx.fillRect(10, rG, 10, 60); ctx.fillRect(380, rD, 10, 60); ctx.beginPath(); ctx.arc(bX, bY, 6, 0, Math.PI*2); ctx.fill();
                        bX += vX; bY += vY; if(bY <= 0 || bY >= 250) vY = -vY;
                        if(bX <= 20 && bY >= rG && bY <= rG+60) vX = -vX; if(bX >= 370 && bY >= rD && bY <= rD+60) vX = -vX;
                        if(bX < 0 || bX > 400) { bX = 200; bY = 125; vX = -vX; } if(rD + 30 < bY) rD += 2.5; else rD -= 2.5; requestAnimationFrame(dessiner);
                    }
                    dessiner(); window.addEventListener('keydown', function(e) { if(e.key === 'z' || e.key === 'Z') rG = Math.max(0, rG - 20); if(e.key === 's' || e.key === 'S') rG = Math.min(190, rG + 20); });`;
            } else {
                scriptActions = `
                    document.querySelectorAll('.buko-btn').forEach(btn => {
                        btn.onclick = function() { alert("⚡ Exécution du protocole BuKo OS réussie !"); };
                    });`;
            }
            const F1 = "<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>BuKo App</title><style>body{padding:20px;font-family:sans-serif;background:#f5f6fa;}.buko-space-title{font-size:1.4rem;font-weight:bold;border-bottom:3px solid #ffcc00;padding-bottom:5px;margin-bottom:20px;color:#2c3e50;text-align:center;}.buko-btn{padding:15px;border:none;border-radius:5px;font-weight:bold;margin:10px 0;display:block;width:100%;color:white;font-size:1.1rem;cursor:pointer;}.buko-btn.Vert{background:#2ecc71;}.buko-btn.Bleu{background:#3498db;}.buko-btn.Standard{background:#bdc3c7;color:black;}.buko-text{font-size:1.1rem;margin:12px 0;color:#333;text-align:center;font-weight:bold;}.buko-input{display:block;width:100%;padding:12px;margin:10px 0;border:2px solid #bdc3c7;border-radius:5px;font-size:1rem;background:#fff;}</style></head><body><div id='canvas'>";
            const F2 = "</div><script>window.onload = function() { " + scriptActions + " };<\/script></body></html>";
            let blob = new Blob([F1 + HTML_Contenu + F2], { type: "text/html;charset=utf-8" });
            let lien = document.createElement("a"); lien.href = URL.createObjectURL(blob); lien.download = "ma_creation_buko.html"; lien.click();
        }
    </script>
</body>
</html>
