<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuKo Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #1e1e24; color: #fff; }
        header { background: #111; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffcc00; }
        h1 { color: #ffcc00; font-size: 1.5rem; }
        .slogan { font-style: italic; font-size: 0.9rem; color: #aaa; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .lang-btn, .clear-btn { background: #ffcc00; color: #000; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .clear-btn { background: #e74c3c; color: #fff; }
        .menu-container { background: #2a2a35; padding: 10px; position: relative; border-bottom: 1px solid #3e3e50; }
        .main-menu-btn { background: #ffcc00; color: #000; font-weight: bold; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; text-align: left; display: flex; justify-content: space-between; }
        .dropdown-content { display: none; background: #1a1a22; border: 1px solid #ffcc00; margin-top: 5px; border-radius: 5px; max-height: 250px; overflow-y: auto; padding: 5px; z-index: 100; position: absolute; left: 10px; right: 10px; }
        .dropdown-content.show { display: block; }
        .tool-btn { display: block; width: 100%; background: none; color: #fff; border: none; padding: 10px; text-align: left; cursor: pointer; border-bottom: 1px solid #2a2a35; font-size: 0.9rem; }
        .tool-btn:hover { background: #3e3e50; color: #ffcc00; }
        .main-container { display: flex; flex-direction: column; flex: 1; }
        .editor-zone { flex: 1; display: flex; flex-direction: column; padding: 10px; }
        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        label { font-size: 0.9rem; color: #ffcc00; font-weight: bold; }
        textarea { flex: 1; background: #111; color: #00ff00; border: 1px solid #3e3e50; padding: 12px; font-family: monospace; font-size: 1rem; resize: none; border-radius: 5px; min-height: 150px; }
        .preview-zone { flex: 1; background: #fff; color: #000; padding: 15px; border-top: 5px solid #ffcc00; overflow-y: auto; }
        .preview-header { font-size: 0.8rem; font-weight: bold; color: #7f8c8d; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 10px; }
        .buko-space-title { font-size: 1.3rem; font-weight: bold; color: #2c3e50; margin-bottom: 15px; border-bottom: 2px solid #2c3e50; padding-bottom: 3px; }
        .buko-btn { padding: 12px 24px; border: none; border-radius: 5px; font-weight: bold; margin: 10px 0; display: block; width: 100%; max-width: 250px; text-align: center; }
        .buko-btn.Vert { background: #2ecc71; color: white; }
        .buko-btn.Bleu { background: #3498db; color: white; }
        .buko-text { font-size: 1.1rem; margin: 8px 0; color: #333; }
        .buko-input { display: block; width: 100%; max-width: 300px; padding: 10px; margin: 8px 0; border: 2px solid #bdc3c7; border-radius: 5px; font-size: 1rem; }
        .generate-bar { background: #111; padding: 10px; text-align: center; }
        .gen-btn { background: #ffcc00; color: #000; border: none; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>BuKo Studio 📦</h1>
            <div class="slogan">« Tout ce qui est facile, c'est du buko »</div>
        </div>
        <div class="header-actions">
            <button class="lang-btn" id="langBtn" onclick="toggleLangue()">🌐 FR</button>
        </div>
    </header>
    <div class="menu-container">
        <button class="main-menu-btn" onclick="toggleMenu()">📦 <span id="lblMenu">Boîte à Mots-Clés Complet (Aide Débutant)</span> ▾</button>
        <div class="dropdown-content" id="dropdownMenu"></div>
    </div>
    <div class="main-container">
        <div class="editor-zone">
            <div class="editor-header">
                <label id="lblEditor">Zone de Code BuKo :</label>
                <button class="clear-btn" id="btnClear" onclick="effacerTout()">🗑️ Tout effacer</button>
            </div>
            <textarea id="codeEditor" placeholder="Écrivez votre logique ici..." oninput="compilerBuKo()"></textarea>
        </div>
        <div class="preview-zone" id="previewZone">
            <div class="preview-header" id="lblPreview">APERCU DE L'INTERFACE (MOTEUR SYNTAXIQUE : WEB)</div>
            <div id="canvas"></div>
        </div>
    </div>
    <div class="generate-bar">
        <button class="gen-btn" id="btnGen" onclick="genererApplication()">Générer mon Application</button>
    </div>
  <script>
        let langueActuelle = 'FR';
        let cibleSysteme = 'web'; 
        const outils = {
            'FR': [
                { nom: '🖥️ Environnement : Bureau (Tkinter)', code: 'appli: bureau .' },
                { nom: '📱 Environnement : Mobile (Kivy)', code: 'appli: mobile .' },
                { nom: '🌐 Environnement : Site (Flask)', code: 'appli: web .' },
                { nom: '🗂️ Ouvrir l\'Espace Ventes', code: '[Espace Ventes]' },
                { nom: '📱 Créer un Bouton Vert', code: 'bouton bouton_principal [texte: "Mettre en vente", couleur: Vert] .' },
                { nom: '📝 Afficher un Texte', code: 'affichage_texte statut [contenu: "En attente..."] .' },
                { nom: '📥 Zone de Saisie', code: 'zone_saisie prix_champ [indication: "Entrez le prix"] .' }
            ],
            'EN': [
                { nom: '🖥️ Environment : Desktop (Tkinter)', code: 'appli: bureau .' },
                { nom: '📱 Environment : Mobile (Kivy)', code: 'appli: mobile .' },
                { nom: '🌐 Environment : Site (Flask)', code: 'appli: web .' },
                { nom: '🗂️ Open Sales Space', code: '[Sales Space]' },
                { nom: '📱 Create Green Button', code: 'button main_button [text: "Publish Sale", color: Green] .' },
                { nom: '📝 Display Text', code: 'text_display status [content: "Awaiting..."] .' },
                { nom: '📥 Input Field', code: 'input_field price_input [indication: "Enter price"] .' }
            ]
        };
        function toggleMenu() { document.getElementById('dropdownMenu').classList.toggle('show'); }
        function effacerTout() {
            if(confirm(langueActuelle === 'FR' ? "Voulez-vous vraiment tout effacer ?" : "Do you really want to clear everything ?")) {
                document.getElementById('codeEditor').value = '';
                compilerBuKo();
            }
        }
        function chargerBoiteOutils() {
            const menu = document.getElementById('dropdownMenu');
            menu.innerHTML = '';
            outils[langueActuelle].forEach(outil => {
                let btn = document.createElement('button');
                btn.className = 'tool-btn';
                btn.innerText = outil.nom;
                btn.onclick = () => {
                    const editor = document.getElementById('codeEditor');
                    editor.value += (editor.value.endsWith('\n') || editor.value === '' ? '' : '\n') + outil.code + '\n';
                    toggleMenu();
                    compilerBuKo();
                };
                menu.appendChild(btn);
            });
        }
        function toggleLangue() {
            langueActuelle = (langueActuelle === 'FR') ? 'EN' : 'FR';
            document.getElementById('langBtn').innerText = '🌐 ' + langueActuelle;
            document.getElementById('lblMenu').innerText = langueActuelle === 'FR' ? 'Boîte à Mots-Clés Complet (Aide Débutant)' : 'Keyword Toolbox (Beginner Help)';
            document.getElementById('btnClear').innerText = langueActuelle === 'FR' ? '🗑️ Tout effacer' : '🗑️ Clear all';
            chargerBoiteOutils();
        }
        function compilerBuKo() {
            const code = document.getElementById('codeEditor').value;
            const canvas = document.getElementById('canvas');
            const previewHeader = document.getElementById('lblPreview');
            canvas.innerHTML = ''; 
            const lignes = code.split('\n');
            lignes.forEach(ligne => {
                let l = ligne.trim();
                if (l.startsWith('[') && l.endsWith(']')) {
                    let t = document.createElement('div');
                    t.className = 'buko-space-title';
                    t.innerText = l.slice(1, -1);
                    canvas.appendChild(t);
                    return;
                }
                if (!l.endsWith('.')) return;
                l = l.slice(0, -1).trim(); 
                if (l.startsWith('appli:')) {
                    let parts = l.split(':');
                    if(parts.length > 1) {
                        let type = parts[1].trim();
                        cibleSysteme = type;
                        if(type === 'bureau') previewHeader.innerText = "APERCU DE L'INTERFACE (MOTEUR SYNTAXIQUE : TKINTER)";
                        else if(type === 'mobile') previewHeader.innerText = "APERCU DE L'INTERFACE (MOTEUR SYNTAXIQUE : KIVY)";
                        else previewHeader.innerText = "APERCU DE L'INTERFACE (MOTEUR SYNTAXIQUE : WEB)";
                    }
                    return;
                }
                if (l.startsWith('bouton') || l.startsWith('button')) {
                    let btn = document.createElement('button');
                    btn.className = 'buko-btn Vert';
                    btn.innerText = 'Bouton Actif';
                    canvas.appendChild(btn);
                } else if (l.startsWith('affichage_texte') || l.startsWith('text_display')) {
                    let txt = document.createElement('div');
                    txt.className = 'buko-text';
                    txt.innerText = 'Élément Texte activé';
                    canvas.appendChild(txt);
                } else if (l.startsWith('zone_saisie') || l.startsWith('input_field')) {
                    let inp = document.createElement('input');
                    inp.className = 'buko-input';
                    inp.placeholder = 'Saisie utilisateur...';
                    canvas.appendChild(inp);
                }
            });
        }
        async function genererApplication() {
            const codeSource = document.getElementById('codeEditor').value;
            if(!codeSource.trim()) { alert("Veuillez d'abord écrire du code BuKo !"); return; }
            let token = localStorage.getItem('buko_user_token');
            let pseudo = "abrahamdawintz666-ai"; 
            if (!token) {
                token = prompt("Collez votre clé secrète GitHub (Token) :");
                if(token) { localStorage.setItem('buko_user_token', token); } 
                else { alert("Configuration annulée."); return; }
            }
            alert("⚡ Connexion sécurisée...\n\nEnvoi du code vers votre robot GitHub Actions.");
            try {
                await fetch(`https://github.com{pseudo}/Buko-Studio/actions/workflows/compilateur.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github+json',
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ref: 'main', inputs: { code_buko: codeSource } })
                });
                alert("🚀 Votre robot distant vient de s'allumer ! Allez sur l'onglet 'Actions' de GitHub pour télécharger l'APK d'ici quelques minutes !");
            } catch (error) { alert("Erreur réseau : " + error); }
        }
        chargerBoiteOutils();
    </script>
</body>
</html>
