name: Compilateur Réel BuKo Android

on:
  workflow_dispatch:
    inputs:
      code_buko:
        description: 'Code source écrit par l utilisateur'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Connexion au dépôt
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Injection du traducteur secret
      run: |
        cat << 'EOF' > main.py
        from kivy.app import App
        from kivy.uix.boxlayout import BoxLayout
        from kivy.uix.button import Button
        from kivy.uix.label import Label
        from kivy.uix.textinput import TextInput

        class AppBuKo(App):
            def build(self):
                layout = BoxLayout(orientation='vertical', padding=15, spacing=10)
                code_brut = """${{ github.event.inputs.code_buko }}"""
                for ligne in code_brut.split('\n'):
                    l = ligne.strip()
                    if not l.endswith('.'): continue
                    l = l[:-1].strip()
                    if l.startswith('bouton') or l.startswith('button'):
                        layout.add_widget(Button(text="Mettre en vente", background_color=(0.18, 0.8, 0.44, 1)))
                    elif l.startswith('affichage_texte') or l.startswith('text_display'):
                        layout.add_widget(Label(text="Enregistrer une Vente", color=(0,0,0,1)))
                    elif l.startswith('zone_saisie') or l.startswith('input_field'):
                        layout.add_widget(TextInput(hint_text="Saisie..."))
                return layout

        if __name__ == '__main__':
            AppBuKo().run()
        EOF

    # Correction de l'erreur d'obsolescence demandée par GitHub
    - name: Installation des outils de compilation Android
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk fontconfig libsqlite3-dev libgdbm-dev libdb5.3-dev libpcap-dev liblzma-dev libffi-dev libssl-dev
        pip install --user --upgrade buildozer cython virtualenv
        
        # Ligne magique : On accepte automatiquement toutes les licences Android SDK de Google
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | sdkmanager --licenses || true
        
        ~/.local/bin/buildozer init
        sed -i 's/# requirements = kivy/requirements = kivy, python3/' buildozer.spec

    # Utilisation de la version v4 moderne exigée par GitHub
    - name: Fabrication du véritable fichier APK
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer android debug

    - name: Sauvegarde du fichier d installation réel
      uses: actions/upload-artifact@v4
      with:
        name: Application-BuKo-Installee
        path: bin/*.apk
