
name: Build BuKo Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "principal"]
    paths:
      - "main.py"
      - "buko_engine_v0_6.py"
      - "buildozer.spec"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

 

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.33" "buildozer==1.5.0"
      - name: Clean previous Android build
        run: |
          rm -rf .buildozer bin


      - name: Clean previous Android build
        run: |
          rm -rf .buildozer bin

      - name: Build Android debug APK
        run: buildozer -v android debug



      - name: Build Android debug APK
        run: buildozer -v android debug
        

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buko-studio-mobile-debug-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14
