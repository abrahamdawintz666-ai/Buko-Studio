name: Creer une application Android BuKo

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - maitre
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-android.yml"
      - "*.py"
      - "*.kv"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"

permissions:
  contents: read

jobs:
  creer-apk:
    name: Construire APK Android
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier les fichiers requis
        run: |
          set -eu
          test -f main.py || {
            echo "ERREUR: main.py absent"
            exit 1
          }
          test -f buildozer.spec || {
            echo "ERREUR: buildozer.spec absent"
            exit 1
          }
          echo "Fichiers requis trouves."
          python3 -m py_compile main.py

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances systeme
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ccache git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.33" "buildozer==1.5.0"
          buildozer --version

      - name: Configurer la licence Android
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          content = path.read_text(encoding="utf-8")
          lines = content.splitlines()

          pattern = re.compile(
              r"^\s*#?\s*android\.accept_sdk_license\s*=.*$"
          )

          for index, line in enumerate(lines):
              if pattern.match(line):
                  lines[index] = "android.accept_sdk_license = True"
                  break
          else:
              app_index = next(
                  (
                      i for i, line in enumerate(lines)
                      if line.strip().lower() == "[app]"
                  ),
                  None,
              )
              if app_index is None:
                  raise SystemExit(
                      "ERREUR: section [app] introuvable dans buildozer.spec"
                  )
              lines.insert(
                  app_index + 1,
                  "android.accept_sdk_license = True",
              )

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          print("Configuration de licence verifiee.")
          PY

          grep -n "android.accept_sdk_license" buildozer.spec

      - name: Construire APK de debogage
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-android.log

      - name: Publier le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation-buko
          path: build-android.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publier les APK generes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: buko-studio-android-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
