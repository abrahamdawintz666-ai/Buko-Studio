
name: Creer une application Android BuKo

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - maitre
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-android.yml"
      - "*.py"
      - "*.kv"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"

permissions:
  contents: read

jobs:
  creer-apk:
    name: Construire APK Android
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: "1"
      P4A_BRANCH: master

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier les fichiers requis
        run: |
          set -eu
          test -f main.py
          test -f buildozer.spec
          python3 -m py_compile main.py
          echo "Fichiers requis trouves."

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances systeme
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ccache git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.33" "buildozer==1.5.0"
          buildozer --version

      - name: Verifier la configuration Android
        run: |
          grep -nE '^(requirements|p4a.branch|android.api|android.minapi|android.archs)' buildozer.spec

      - name: Construire APK de debogage
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-android.log

      - name: Publier le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation-buko
          path: build-android.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publier les APK generes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: buko-studio-android-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
